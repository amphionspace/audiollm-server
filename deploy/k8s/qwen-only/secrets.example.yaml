apiVersion: v1
kind: Secret
metadata:
  name: audiollm-refine
  namespace: audiollm
type: Opaque
stringData:
  REFINE_BASE_URL: https://your-openai-compatible-endpoint.example.com/v1
  REFINE_MODEL: your-refine-model
  REFINE_API_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: audiollm-model-source
  namespace: audiollm
type: Opaque
stringData:
  AMPHION_SPEC_ARCHIVE_URL: https://models.example.com/amphion-spec.tar
  AMPHION_SPEC_ARCHIVE_SHA256: replace-with-64-lowercase-hex-characters
