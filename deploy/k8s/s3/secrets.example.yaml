# ============================================================
# 示例 Secret —— 不要提交真实密钥
# 复制为 /tmp/audiollm-secrets.yaml，填好值后单独 apply：
#   kubectl apply -f /tmp/audiollm-secrets.yaml
# ============================================================

# S3 模型源访问凭证（initContainer 拉模型用）
apiVersion: v1
kind: Secret
metadata:
  name: audiollm-s3
  namespace: audiollm
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
  # AWS_SESSION_TOKEN: replace-me   # 临时凭证才需要

---
# Refine LLM 凭证（gateway 调用 OpenAI-compatible 文本服务用）
apiVersion: v1
kind: Secret
metadata:
  name: audiollm-refine
  namespace: audiollm
type: Opaque
stringData:
  REFINE_BASE_URL: https://your-openai-compatible-endpoint.example.com/v1
  REFINE_MODEL: your-refine-model
  REFINE_API_KEY: replace-me
