defaults:
  asr:
    asr_repetition_penalty: 1.0
    debug_show_dual_asr: false
    enable_dual_asr_fusion: false
    enable_primary_asr: true
    enable_secondary_asr: false
    primary_asr_timeout: 30.0
    split_asr_base_url: http://127.0.0.1:8102
    split_asr_enabled: true
    split_asr_final_only: false
  emotion:
    emotion_job_queue_max: 64
    emotion_job_ttl_sec: 3600
    emotion_max_audio_seconds: 20.0
    emotion_max_concurrent_jobs: 8
    emotion_task_mode: ser
  emotion_spec:
    emotion_spec_job_queue_max: 64
    emotion_spec_job_ttl_sec: 3600
    emotion_spec_max_audio_seconds: 20.0
    emotion_spec_max_concurrent_jobs: 8
    emotion_spec_task_mode: sepc
  enrollment:
    asr_enrollment_max_entries: 256
    asr_enrollment_max_sec: 8.0
    asr_enrollment_min_sec: 1.0
    asr_enrollment_ttl_sec: 3600
  fusion:
    fusion_disagreement_threshold: 0.55
    fusion_hotword_boost: 0.12
    fusion_max_repetition_ratio: 0.35
    fusion_min_primary_score: 0.55
    fusion_primary_score_margin: 0.08
    fusion_similarity_threshold: 0.85
  hotword_recall:
    enable_hotword_recall: true
    recall_custom_hotword_limit: 50
    recall_max_concurrent: 4
    recall_queue_timeout_ms: 500
    recall_top_k: 50
  itn:
    asr_itn_enable_0_to_9: false
    enable_asr_itn: true
    enable_asr_plate_normalize: true
    enable_asr_repetition_fix: true
  pseudo_stream:
    ascend_k2_enabled: false
    asr_final_executor_workers: 20
    asr_final_max_concurrent: 20
    asr_final_max_tokens: 256
    asr_final_session_parallel: 2
    asr_first_partial_max_concurrent: 24
    asr_first_partial_priority_ms: 0
    asr_partial_first_max_tokens: 64
    asr_partial_refresh_adaptive_enabled: true
    asr_partial_refresh_high_pressure_feed_queue_depth: 1024
    asr_partial_refresh_high_pressure_final_backlog: 24
    asr_partial_refresh_high_pressure_interval_ms: 8000
    asr_partial_refresh_max_concurrent: 4
    asr_partial_refresh_max_tokens: 128
    asr_partial_refresh_pressure_feed_queue_depth: 256
    asr_partial_refresh_pressure_final_backlog: 8
    asr_partial_refresh_pressure_interval_ms: 3000
    asr_partial_refresh_queue_timeout_ms: 0
    asr_post_chat_timing_enabled: true
    asr_stop_flush_executor_workers: 52
    asr_stop_flush_max_concurrent: 52
    asr_stop_flush_jitter_ms: 500
    ctc_decode_batch_size: 52
    ctc_decode_wait_ms: 10
    ctc_device_id: 0
    ctc_device_resident_state: false
    ctc_prefill_warmup_ms: 0
    ctc_om_model_dir: /home/workspace/models/ctc_candidates/pkufool-zipformer-small-streaming-ctc-zhen/om_bs52_forcefp32_ascend910b3_cann851
    ctc_om_model_path: /home/workspace/models/ctc_candidates/pkufool-zipformer-small-streaming-ctc-zhen/om_bs52_forcefp32_ascend910b3_cann851/model_bs52_linux_aarch64.om
    ctc_onnx_model_path: /home/workspace/models/ctc_candidates/pkufool-zipformer-small-streaming-ctc-zhen/ctc-chunk-16-left-64.onnx
    ctc_final_tail_pause_enabled: false
    ctc_final_tail_pause_silence_ms: 200
    ctc_partial_post_first_interval_ms: 500
    ctc_prefeed_emit_enabled: true
    ctc_ready_coalesce_ms: 30
    ctc_result_wait_ms: 120
    ctc_tokens_path: /home/workspace/models/ctc_candidates/pkufool-zipformer-small-streaming-ctc-zhen/tokens.txt
    enable_pseudo_stream: true
    k2_decode_batch_max_size: 16
    k2_decode_batch_wait_ms: 0
    k2_endpoint_silence_sec: 2.5
    k2_max_segment_sec: 30.0
    k2_om_model_dir: ''
    k2_om_runtime_pool_size: 1
    k2_om_soc_version: ''
    k2_online_ready_coalesce_ms: 0
    k2_online_result_wait_min_audio_ms: 800
    k2_online_result_wait_ms: 0
    k2_partial_first_text_interval_ms: 500
    k2_partial_post_text_interval_ms: 600
    pseudo_stream_first_partial_ms: 200
    pseudo_stream_interval_ms: 600
    sherpa_blank_penalty: 0.0
    sherpa_model_dir: /home/workspace/models/k2_0610_zhen
    sherpa_num_threads: 2
    sherpa_provider: cpu
    sherpa_runtime_pool_size: 1
    sherpa_use_int8: true
    stream_feed_batch_max_frames: 32
    stream_feed_drain_batch_max_frames: 1024
    stream_feed_drain_timeout_sec: 3.0
    stream_feed_initial_batch_max_frames: 16
    stream_feed_target_ms: 0
    streaming_partial_backend: ctc_om
    sherpa_executor_workers: 4
    ctc_resident_pace_ms: 0
  transcribe:
    transcribe_job_queue_max: 8
    transcribe_job_ttl_sec: 3600
    transcribe_max_audio_sec: 10800
    transcribe_max_concurrent_jobs: 2
    transcribe_max_segment_sec: 30.0
    transcribe_max_upload_bytes: 536870912
    transcribe_segment_concurrency: 1
    transcribe_silence_duration_ms: 800
  vad:
    min_segment_duration_ms: 350
    silence_duration_ms: 1200
    vad_keep_tail_ms: 40
    vad_pre_speech_ms: 500
    vad_smoothing_alpha: 0.3
    vad_start_frames: 20
    vad_threshold: 0.45
endpoints:
- client_overridable: true
  path: /transcribe-streaming
  protocol: native
  task: asr
  upstreams:
    primary: amphion_asr
    secondary: qwen_asr
- lock:
    enable_secondary_asr: false
  path: /tuling/ast/v3
  protocol: astv3
  task: asr
  upstreams:
    primary: amphion_asr
- path: /emotion-segmented-streaming
  protocol: native
  task: emotion
  upstreams:
    emotion: amphion_emotion
- input_sample_rate: 48000
  path: /ws/audio
  protocol: native
  task: browser_demo
  upstreams:
    emotion_spec: amphion_spec
    primary: amphion_asr
    secondary: qwen_asr
http_pool:
  max_connections: 64
  max_keepalive_connections: 0
rest:
  routes:
    transcribe:
      enable_dual_asr_fusion: false
      upstreams:
        primary: amphion_asr
        secondary: qwen_asr
  upstreams:
    emotion: amphion_emotion
    emotion_spec: amphion_spec
    primary: amphion_asr
    secondary: qwen_asr
services:
  hotword: hotword_llm
  recall: rag_asr_recall
  text_cleanup: dashscope_cleanup
upstreams:
  amphion_asr:
    base_url: http://127.0.0.1:8102
    model_name: AmphionASR-1.7B
    prompt_template: amphion_asr_1.7b
    timeout: 120
  amphion_emotion:
    base_url: http://localhost:8222
    model_name: AmphionSE
    timeout: 30
  amphion_spec:
    base_url: http://localhost:9001
    model_name: AmphionSPEC
    timeout: 30
  dashscope_cleanup:
    api_key: ${DASHSCOPE_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode
    max_tokens: 1024
    model_name: qwen2.5-32b-instruct
    timeout: 30
  hotword_llm:
    api_key: ${HOTWORD_API_KEY}
    base_url: ${HOTWORD_BASE_URL}
    model_name: ${HOTWORD_MODEL}
    timeout: 30
  qwen_asr:
    base_url: http://localhost:8001
    model_name: Qwen/Qwen3-ASR-1.7B
    timeout: 120
  rag_asr_recall:
    base_url: http://127.0.0.1:10001
    model_name: rag_asr_retrieve
    timeout: 30.0
